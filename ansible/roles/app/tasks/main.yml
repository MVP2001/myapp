---
- name: Ensure app directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Clone repository
  git:
    repo: https://github.com/MVP2001/myapp.git
    dest: "{{ app_dir }}"
    version: main
  become: yes
  become_user: "{{ ansible_user }}"

- name: Create monitoring directories
  file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - monitoring/prometheus
    - monitoring/grafana
    - monitoring/loki
    - monitoring/promtail
    - letsencrypt

- name: Template docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Template Prometheus config
  template:
    src: prometheus.yml.j2
    dest: "{{ app_dir }}/monitoring/prometheus/prometheus.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Start application
  shell: |
    cd {{ app_dir }} && docker compose up -d
  become: yes
  become_user: "{{ ansible_user }}"
