---
- name: Create app directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_name }}"
    group: "{{ app_name }}"
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ data_dir }}"
    - "{{ app_dir }}/letsencrypt"
    - "{{ app_dir }}/monitoring"

- name: Copy Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
  notify: restart app

- name: Copy environment file
  template:
    src: .env.j2
    dest: "{{ app_dir }}/.env"
    mode: '0600'
  notify: restart app

- name: Copy monitoring configs
  copy:
    src: "{{ item }}"
    dest: "{{ app_dir }}/"
    owner: "{{ app_name }}"
    group: "{{ app_name }}"
  loop:
    - monitoring/
    - traefik/
  notify: restart app

- name: Pull latest images
  command: 
    cmd: docker-compose pull
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Start application
  command:
    cmd: docker-compose up -d
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Wait for health check
  uri:
    url: "http://localhost:{{ app_port }}/health"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 10
  delay: 5
