---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - htop
      - vim
      - git
      - make
      - python3-pip
    state: present

- name: Configure timezone
  timezone:
    name: UTC

- name: Create app user
  user:
    name: "{{ app_name }}"
    system: yes
    shell: /bin/false
    home: "{{ app_dir }}"
    create_home: yes
