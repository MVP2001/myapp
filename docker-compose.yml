services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # 🔥 ДОБАВЛЕНО: Явно указываем сеть для Docker provider
      - "--providers.docker.network=myapp_backend"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=mihailpodorets01@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=DEBUG"
      # 🔥 ДОБАВЛЕНО: API insecure для отладки (убрать в проде)
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
      # 🔥 ДОБАВЛЕНО: Временно открываем dashboard на порту 8080
      - "8080:8080"
    volumes:
      # 🔥 ИСПРАВЛЕНО: Проверь, что путь правильный
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - ./letsencrypt:/letsencrypt
    networks:
      - backend
    # 🔥 ДОБАВЛЕНО: Явно указываем сеть в labels
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=myapp_backend"
      - "traefik.http.routers.traefik.rule=Host(`traefik.mvp2001.ru`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.entrypoints=websecure"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devops_app
      POSTGRES_USER: appuser
      # 🔥 ИЗМЕНЕНО: Используем переменную окружения из .env
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d devops_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  app:
    build: ./app
    container_name: test-app
    # 🔥 УБРАНО: Прямой проброс порта (всё через Traefik)
    # ports:
    #   - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # 🔥 ДОБАВЛЕНО: Строка подключения к БД
      DATABASE_URL: postgres://appuser:secretpassword123@postgres:5432/devops_app?sslmode=disable
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/secrets/vault_token
    secrets:
      - vault_token
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      # 🔥 ВАЖНО: Явно указываем сеть
      - "traefik.docker.network=myapp_backend"
      # 🔥 ИСПРАВЛЕНО: Два отдельных роутера вместо || (более стабильно)
      - "traefik.http.routers.app-root.rule=Host(`mvp2001.ru`)"
      - "traefik.http.routers.app-root.entrypoints=websecure"
      - "traefik.http.routers.app-root.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-root.service=app-service"
      - "traefik.http.routers.app-sub.rule=Host(`app.mvp2001.ru`)"
      - "traefik.http.routers.app-sub.entrypoints=websecure"
      - "traefik.http.routers.app-sub.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-sub.service=app-service"
      - "traefik.http.services.app-service.loadbalancer.server.port=3000"
    restart: unless-stopped

  # 🔥 ДОБАВЛЕНО: PostgreSQL Exporter (был в prometheus.yml, но не в compose)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://appuser:secretpassword123@postgres:5432/devops_app?sslmode=disable"
    networks:
      - backend
    depends_on:
      - postgres
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.mvp2001.ru`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      # 🔥 ДОБАВЛЕНО: Базовая авторизация
      - "traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"
      - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.mvp2001.ru
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.mvp2001.ru`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - backend
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"  # 🔥 ИЗМЕНЕНО: Только localhost
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - backend
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - backend
    depends_on:
      - loki
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  # 🔥 ДОБАВЛЕНО: Jaeger (был в README, но не в compose)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.mvp2001.ru`)"
      - "traefik.http.routers.jaeger.entrypoints=websecure"
      - "traefik.http.routers.jaeger.tls.certresolver=letsencrypt"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
    restart: unless-stopped

  # 🔥 ДОБАВЛЕНО: Vault в production-режиме (не dev)
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
      - ./vault/config:/vault/config
    command: server -config=/vault/config/vault.hcl
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`vault.mvp2001.ru`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls.certresolver=letsencrypt"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  letsencrypt:
  prometheus_data:
  grafana_data:
  loki_data:
  vault_data:

# 🔥 ДОБАВЛЕНО: Docker Secrets для безопасности
secrets:
  db_password:
    file: ./secrets/db_password.txt
  grafana_admin_user:
    file: ./secrets/grafana_admin_user.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  vault_token:
    file: ./secrets/vault_token.txt
