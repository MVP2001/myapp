version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - typecheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

# 🔥 ИСПРАВЛЕНО: skip-dirs теперь здесь, а не в run
formatters:
  exclusions:
    paths:
      - vendor
